[package]
name = "llama-cli"
version = "0.1.0"
edition = "2021"
description = "Run local open-source Llama models (≤30B) through a locally-running Ollama server"
license = "MIT"
repository = "https://github.com/OWNER/REPO" # <-- update after you create the GitHub repo

# Deliberately tiny dependency tree. `reqwest` has NO TLS backend (Ollama is
# plain HTTP on localhost), so we avoid ring/openssl and any C toolchain
# entirely -> faster builds, fully reproducible, cross-platform.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
anyhow = "1"
bytes = "1"

# Unix only: used once at startup to restore the default SIGPIPE behavior, so
# `llama guide | head` dies quietly like a normal CLI tool instead of panicking.
# (Already in the dependency tree transitively via tokio -- this just names it.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
