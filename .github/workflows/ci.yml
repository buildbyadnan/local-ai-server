name: ci

# Run the test suite on every push / pull request, across the main platforms,
# and lint + build the web UI crate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  web:
    name: web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/web
    steps:
      - uses: actions/checkout@v7

      # `version: 12` stays explicit: packageManager pins pnpm@12.14.0 in
      # crates/web/package.json, but action-setup only reads packageManager
      # from the repo root, and this monorepo keeps web's manifest nested.
      - uses: pnpm/action-setup@v6
        with:
          version: 12

      # Pinned to the exact engines floor (crates/web/package.json):
      # `node-version: 22` + setup-node's default check-latest=false reuses the
      # runner's pre-cached 22.23.3, which pnpm rejects (ERR_PNPM_UNSUPPORTED_ENGINE)
      # because 22.23.3 still has the Brotli RCE (CVE-2026-111497).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: crates/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
