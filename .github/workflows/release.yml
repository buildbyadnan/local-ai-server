name: release

# Build prebuilt binaries for macOS (arm64 + intel), Linux (x64 + arm), and
# Windows, and attach them to a GitHub Release whenever a `v*` tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Users then download the binary for their OS from the Releases page, or run
# install.sh / install.ps1.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compile Intel on the arm64 runner (no EOL macos-13 needed).
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/llama-cli" "$stage/llama"
          tar -C "$stage" -czf "llama-cli-${{ matrix.target }}.tar.gz" llama

      # Compress-Archive (not 7z) so the zip contains `llama.exe` at its root,
      # not a nested temp path -- the installer expects a flat archive.
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path ([System.IO.Path]::GetTempPath()) -Force
          Copy-Item "target/${{ matrix.target }}/release/llama-cli.exe" (Join-Path $stage "llama.exe") -Force
          Compress-Archive -Path (Join-Path $stage "llama.exe") -DestinationPath "llama-cli-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-cli-${{ matrix.target }}
          path: llama-cli-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
